# Reemplazar <ACM_CERTIFICATE_ARN> por `terraform output -raw acm_certificate_arn`
# antes de aplicar - ver README.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello-world
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    # target-type: ip es OBLIGATORIO en Fargate - no hay instancia EC2
    # detras del pod para usar "instance" (el default), el ALB tiene que
    # apuntar directo a la IP del pod dentro de la VPC.
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/certificate-arn: <ACM_CERTIFICATE_ARN>
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}, {"HTTP":80}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    # group.name: comparte el mismo ALB con Argo CD (namespace argocd,
    # host argocd.aws.jalcalaroot.com) en vez de un ALB por app - sin esto,
    # instalar Argo CD hubiera creado un segundo Application Load Balancer,
    # costo extra por hora + LCU sin necesidad. El listener HTTPS soporta
    # varios certs por SNI, uno por host, en el mismo ALB.
    alb.ingress.kubernetes.io/group.name: eks-demo-apps
spec:
  # spec.ingressClassName (no la annotation vieja kubernetes.io/ingress.class)
  # - mismo tipo de gotcha que con AGIC: usar el nombre de clase incorrecto
  # deja al controller sin procesar el Ingress, sin error visible.
  ingressClassName: alb
  rules:
    # host explicito, obligatorio ahora que se comparte el ALB con otro
    # Ingress (Argo CD) - sin esto, esta regla sin host matchea CUALQUIER
    # hostname que llegue al ALB, incluido argocd.aws.jalcalaroot.com,
    # tapando la regla de Argo.
    - host: eks.aws.jalcalaroot.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hello-world
                port:
                  number: 80
