name: Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - "*.tf"
      - ".github/workflows/terraform-apply.yml"
  # Sin schedule semanal: a diferencia de un certificado Let's Encrypt, el
  # cert de ACM (acm.tf) renueva solo mientras el registro de validacion en
  # Route53 siga existiendo - no hace falta un re-apply periodico para eso.

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-apply
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_VAR_owner: ${{ vars.OWNER }}
  TF_VAR_network_compute_subnet_ids: ${{ vars.NETWORK_COMPUTE_SUBNET_IDS }}
  TF_VAR_network_public_subnet_ids: ${{ vars.NETWORK_PUBLIC_SUBNET_IDS }}
  TF_VAR_dns_zone_id: ${{ vars.DNS_ZONE_ID }}
  TF_VAR_github_repo_subject_prefix: ${{ vars.GH_REPO_SUBJECT_PREFIX }}
  TF_VAR_github_oidc_provider_arn: ${{ vars.GH_OIDC_PROVIDER_ARN }}

jobs:
  apply:
    name: Apply
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar credenciales AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_AGENT }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Descargar IAM policy oficial del ALB Controller
        run: |
          # policies/ esta gitignored y no tiene otro archivo tracked -
          # git no trackea directorios vacios, asi que un checkout limpio
          # no lo trae. mkdir -p evita "curl: (23) Failure writing output
          # to destination" (paso al que directorio no existe).
          mkdir -p policies
          curl -sSf -o policies/aws-load-balancer-controller-iam-policy.json \
            https://raw.githubusercontent.com/kubernetes-sigs/aws-load-balancer-controller/v2.13.0/docs/install/iam_policy.json

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.16"
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve tfplan
