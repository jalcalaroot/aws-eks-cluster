name: Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - "*.tf"
      - ".github/workflows/terraform-apply.yml"
  # Sin schedule semanal: a diferencia de un certificado Let's Encrypt, el
  # cert de ACM (acm.tf) renueva solo mientras el registro de validacion en
  # Route53 siga existiendo - no hace falta un re-apply periodico para eso.

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-apply
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_VAR_owner: ${{ vars.OWNER }}
  TF_VAR_network_compute_subnet_ids: ${{ vars.NETWORK_COMPUTE_SUBNET_IDS }}
  TF_VAR_network_public_subnet_ids: ${{ vars.NETWORK_PUBLIC_SUBNET_IDS }}
  TF_VAR_dns_zone_id: ${{ vars.DNS_ZONE_ID }}

jobs:
  apply:
    name: Apply
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar credenciales AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: arn:aws:iam::740104998573:role/eks-cluster-ci-agent
          aws-region: ${{ env.AWS_REGION }}

      - name: Descargar IAM policy oficial del ALB Controller
        run: |
          curl -sSf -o policies/aws-load-balancer-controller-iam-policy.json \
            https://raw.githubusercontent.com/kubernetes-sigs/aws-load-balancer-controller/v2.13.0/docs/install/iam_policy.json

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.16"
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve tfplan
